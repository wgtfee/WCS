name: WCS S9 Software Trial Readiness

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Simulator/HilVerification/**'
      - 'src/Wcs.Simulator.Tests/SimulationHilVerificationTests.cs'
      - 'src/Wcs.Simulator.Tests/SimulationHilSoftwareReadinessTests.cs'
      - 'src/Wcs.Host/Controllers/HilVerificationController.cs'
      - 'src/Wcs.Host/appsettings.HIL.json'
      - 'src/Wcs.Host/appsettings.TrialRun.json'
      - 'scripts/s9/**'
      - '.github/workflows/simulation-s9-hil-contract.yml'
      - '.github/workflows/simulation-s9-real-hil-evidence.yml'
      - '.github/workflows/simulation-s9-software-readiness.yml'
      - 'docs/交付文件/82-*'
      - 'docs/交付文件/83-*'
      - 'docs/交付文件/84-*'
      - 'docs/交付文件/85-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-readiness:
    name: verify S9 software is ready to enter site-owned HIL without claiming site acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore

      - name: Run exactly 8 S9 software-readiness tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/s9-software-readiness
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~SimulationHilSoftwareReadinessTests' \
            --logger 'trx;LogFileName=s9-software-readiness.trx' \
            --results-directory artifacts/s9-software-readiness
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path='artifacts/s9-software-readiness/s9-software-readiness.trx'
          root=ET.parse(path).getroot()
          results=root.findall('.//{*}UnitTestResult')
          failed=[x for x in results if x.attrib.get('outcome') != 'Passed']
          assert len(results) == 8, f'expected 8 readiness tests, got {len(results)}'
          assert not failed, f'failed readiness tests: {[x.attrib.get("testName") for x in failed]}'
          print('S9 software readiness tests: 8/8 success')
          PY

      - name: Verify HIL host profiles are non-production and do not connect real PLC workers
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.HilVerification.Enabled' src/Wcs.Host/appsettings.HIL.json)" = 'true'
          test "$(jq -r '.HilVerification.Enabled' src/Wcs.Host/appsettings.TrialRun.json)" = 'true'
          test "$(jq -r '.Simulator.Enabled' src/Wcs.Host/appsettings.HIL.json)" = 'true'
          test "$(jq -r '.Simulator.Enabled' src/Wcs.Host/appsettings.TrialRun.json)" = 'true'
          test "$(jq -r '.HilVerification.Enabled // false' src/Wcs.Host/appsettings.Production.json)" = 'false'
          test "$(jq -r '.HilVerification.Enabled // false' src/Wcs.Host/appsettings.json)" = 'false'
          ! grep -q 'Production' <(jq -r '.HilVerification.AllowedEnvironments[]' src/Wcs.Host/appsettings.HIL.json)
          ! grep -q 'Production' <(jq -r '.HilVerification.AllowedEnvironments[]' src/Wcs.Host/appsettings.TrialRun.json)

      - name: Verify S9 HTTP surface is read-only
        shell: bash
        run: |
          set -euo pipefail
          file='src/Wcs.Host/Controllers/HilVerificationController.cs'
          grep -q '\[HttpGet("status")\]' "$file"
          grep -q '\[HttpGet("acceptance-requirements")\]' "$file"
          ! grep -Eq '\[Http(Post|Put|Patch|Delete)' "$file"
          grep -q 'remoteControlAllowed = false' "$file"
          grep -q 'controlEndpointsExposed = false' "$file"

      - name: Verify real-HIL workflow is manual self-hosted only
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/simulation-s9-real-hil-evidence.yml'
          grep -q '^  workflow_dispatch:' "$file"
          ! grep -q '^  pull_request:' "$file"
          grep -q 'runs-on: \[self-hosted, wcs-hil\]' "$file"
          grep -q 'WCS_HIL_EVIDENCE_MANIFEST' "$file"
          grep -q 'WCS_HIL_EVIDENCE_BUNDLE' "$file"
          python3 -m py_compile scripts/s9/validate_hil_evidence.py

      - name: Write software-readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/s9-software-readiness/readiness.txt <<EOF
          head_sha=${GITHUB_SHA}
          hosted_ci_real_hil=false
          hosted_ci_site_acceptance=false
          production_api_enabled=false
          hil_api_read_only=true
          self_hosted_real_hil_gate=required
          real_hardware_evidence=external-required
          EOF

      - name: Upload S9 software-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-s9-software-trial-readiness-${{ github.run_number }}
          path: artifacts/s9-software-readiness/**
          if-no-files-found: error
          retention-days: 30
