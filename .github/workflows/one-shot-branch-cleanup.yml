name: One-shot stale branch cleanup

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete confirmed stale branches
    runs-on: ubuntu-latest
    if: github.repository == 'wgtfee/WCS'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete remaining historical branches
        shell: bash
        run: |
          set -euo pipefail

          protected=(
            "main"
            "develop"
            "Dev_IAM"
            "agent/mcp-readonly-adapter"
            "agent/mcp-iam-boundary"
            "codex/simulation-ui-cn-phase6-visual-status"
            "ui/operations-product-pages"
          )

          stale=(
            "agent/anomaly-fusion-v3-3-closeout"
            "agent/phase7-plc-driver"
            "agent/phase8-commissioning"
            "agent/phase9-production-dispatch"
            "agent/phase10-observability"
            "agent/phase11-resilience"
            "agent/phase12-simulation"
            "codex/simulation-ui-cn-advanced"
          )

          is_protected() {
            local candidate="$1"
            local item
            for item in "${protected[@]}"; do
              if [[ "$candidate" == "$item" ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          skipped=0

          for branch in "${stale[@]}"; do
            if is_protected "$branch"; then
              echo "ERROR: cleanup list contains protected branch: $branch"
              exit 1
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Skipping missing branch $branch"
              skipped=$((skipped + 1))
            fi
          done

          echo "Deleted: $deleted"
          echo "Missing/skipped: $skipped"
