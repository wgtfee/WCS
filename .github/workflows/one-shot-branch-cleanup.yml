name: One-shot stale branch cleanup

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete confirmed stale branches
    runs-on: ubuntu-latest
    if: github.repository == 'wgtfee/WCS'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete confirmed stale branches
        shell: bash
        run: |
          set -euo pipefail

          protected=(
            "main"
            "develop"
            "Dev_IAM"
            "agent/mcp-readonly-adapter"
            "agent/mcp-iam-boundary"
            "codex/simulation-ui-cn-phase6-visual-status"
            "ui/operations-product-pages"
          )

          stale=(
            "agent/documentation-package"
            "agent/fix-phase12-cs0173"
            "agent/sim-acceptance-center-library"
            "agent/sim-acceptance-center-navigation"
            "agent/simulation-visual-batch-a-plc-rgv"
            "agent/simulation-visual-batch-b-traffic-external"
            "agent/simulation-visual-batch-c-timeline"
            "agent/simulation-visual-scenario-editor"
            "agent/transport-loadtest"
            "codex/sim-visual-batch-d-acceptance"
            "codex/simulation-beginner-cn-ui"
            "codex/simulation-ui-cn-phase2"
            "codex/simulation-ui-cn-phase3"
            "codex/simulation-ui-cn-phase4"
            "codex/simulation-ui-cn-phase5-device-status"
            "fix/desktop-tab-routing-regression"
            "fix/simulation-acceptance-button-state"
            "fix/transport-capacity-drain-window"
            "fix/windows-ci-simulator-boundaries"
            "ui/industrial-desktop-and-simulation-data"
            "feature/anomaly-evidence-fusion-v3-3"
            "feature/anomaly-health-governance-v3-5"
            "feature/anomaly-health-scoring-v3-4"
            "feature/anomaly-root-cause-propagation-v3-6"
            "feature/desktop-atomui-common-ops-4"
            "feature/desktop-atomui-common-pages"
            "feature/desktop-atomui-common-transport-1"
            "feature/desktop-atomui-common-transport-2"
            "feature/desktop-atomui-common-transport-3"
            "feature/desktop-atomui-idi-pages-6"
            "feature/desktop-atomui-product-theme"
            "feature/desktop-atomui-runtime-pages-5"
            "feature/desktop-atomui-shell-final"
            "feature/failure-probability-rul-v3-9"
            "feature/idi-p0-governance-contracts"
            "feature/idi-p1-modelops-center"
            "feature/idi-p2-feature-center"
            "feature/idi-p3-shadow-decision"
            "feature/idi-p4-maintenance-learning"
            "feature/idi-p5-digital-twin-optimizer"
            "feature/idi-p6-bounded-automation-readiness"
            "feature/maintenance-feedback-loop-v3-7"
            "feature/plc-anomaly-context-peer-v3-1"
            "feature/plc-anomaly-engine-v1"
            "feature/plc-anomaly-governance-v2-1"
            "feature/plc-anomaly-ml-v2"
            "feature/plc-telemetry-storage"
            "feature/pluggable-onnx-runtime-v3-8"
            "feature/simulation-s0-governance"
            "feature/simulation-s1-scenario-engine"
            "feature/simulation-s10-unified-console"
            "feature/simulation-s2-virtual-plc"
            "feature/simulation-s3-virtual-rgv"
            "feature/simulation-s4-traffic-deadlock"
            "feature/simulation-s5-external-failures"
            "feature/simulation-s6-health-rul"
            "feature/simulation-s7-integration-recovery"
            "feature/simulation-s8-capacity-hil-readiness"
            "feature/simulation-s9-real-hil-trial"
            "feature/simulation-verification-foundation"
            "feature/transport-cycle-anomaly-v3-2"
            "feature/wcs-intelligence-productization"
          )

          is_protected() {
            local candidate="$1"
            local item
            for item in "${protected[@]}"; do
              if [[ "$candidate" == "$item" ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          skipped=0

          for branch in "${stale[@]}"; do
            if is_protected "$branch"; then
              echo "ERROR: cleanup list contains protected branch: $branch"
              exit 1
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Skipping missing branch $branch"
              skipped=$((skipped + 1))
            fi
          done

          echo "Deleted: $deleted"
          echo "Missing/skipped: $skipped"
