name: WCS Simulation Health RUL Determinism

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Simulator/VirtualHealth/**'
      - 'src/Wcs.Simulator.Tests/SimulationVirtualHealthTests.cs'
      - 'src/Wcs.Host/appsettings.Simulation*.json'
      - '.github/workflows/simulation-health-rul-determinism.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-rul-determinism:
    name: verify health profile feature RUL checkpoint and replay determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/simulation-s6-determinism
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj 2>&1 | tee artifacts/simulation-s6-determinism/restore.log
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj --configuration Release --no-restore 2>&1 | tee artifacts/simulation-s6-determinism/build.log

      - name: Run exact S6 runtime determinism tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            --configuration Release --no-build \
            --filter 'FullyQualifiedName~SimulationVirtualHealthTests' \
            --logger 'trx;LogFileName=simulation-s6-determinism.trx' \
            2>&1 | tee artifacts/simulation-s6-determinism/test.log
          grep -Eq 'Passed!.*Total:[[:space:]]+8|Passed:[[:space:]]+8.*Total:[[:space:]]+8' artifacts/simulation-s6-determinism/test.log

      - name: Verify deterministic storage and forecast-oracle policy
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n 'SimulationStateStore' src/Wcs.Simulator/VirtualHealth/VirtualHealthRuntime.cs
          grep -R -n 'AssetFailureForecastFeatureBuilder' src/Wcs.Simulator/VirtualHealth/VirtualHealthRuntime.cs
          grep -R -n 'ValidateOutput' src/Wcs.Simulator/VirtualHealth/VirtualHealthRuntime.cs
          grep -R -n 'health.forecast.oracle' src/Wcs.Simulator/VirtualHealth/VirtualHealthScenarioHandlers.cs
          ! grep -R -nE 'DateTime\.Now|DateTime\.UtcNow|Task\.Delay|Thread\.Sleep|Random\.Shared|HttpClient|SqlConnection|SqlSugar|InferenceSession|Microsoft\.ML\.OnnxRuntime|IAssetFailureForecastService|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|IRouteReservationManager' src/Wcs.Simulator/VirtualHealth

      - name: Upload S6 determinism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-simulation-health-rul-determinism-${{ github.run_number }}
          path: artifacts/simulation-s6-determinism/**
          if-no-files-found: error
          retention-days: 14
