name: WCS IAM Management Validation

on:
  push:
    branches: [ Dev_IAM ]
  pull_request:
    branches: [ Dev_IAM ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  desktop-build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
    steps:
      - name: Checkout WCS
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WCS Desktop
        run: dotnet restore src/Wcs.Desktop/Wcs.Desktop.csproj

      - name: Build WCS Desktop
        run: dotnet build src/Wcs.Desktop/Wcs.Desktop.csproj --configuration $env:CONFIGURATION --no-restore --verbosity normal

      - name: Publish Desktop build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'ci/wcs-desktop-build',
              description: passed ? 'WCS Desktop build passed' : 'WCS Desktop build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_CI_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.PAT || secrets.REPO_TOKEN || secrets.ACCESS_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || github.token }}

    steps:
      - name: Checkout WCS
        uses: actions/checkout@v4
        with:
          path: platform/WCS

      - name: Checkout Security.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Security.Abstractions
          ref: master
          path: platform/Industrial.Security/src/Industrial.Security.Abstractions
          token: ${{ env.PLATFORM_TOKEN }}

      - name: Checkout Security.AspNetCore
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Security.AspNetCore
          ref: master
          path: platform/Industrial.Security/src/Industrial.Security.AspNetCore
          token: ${{ env.PLATFORM_TOKEN }}

      - name: Checkout Health.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Health.Abstractions
          ref: master
          path: platform/Industrial.Health/src/Industrial.Health.Abstractions
          token: ${{ env.PLATFORM_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WCS runtime tests
        working-directory: platform/WCS
        run: dotnet restore src/Wcs.Core.Tests/Wcs.Core.Tests.csproj

      - name: Run WCS runtime regression tests
        working-directory: platform/WCS
        run: dotnet test src/Wcs.Core.Tests/Wcs.Core.Tests.csproj --configuration $env:CONFIGURATION --no-restore --verbosity normal

      - name: Restore WCS host security tests
        working-directory: platform/WCS
        run: dotnet restore src/Wcs.Host.Tests/Wcs.Host.Tests.csproj

      - name: Run WCS host security tests
        working-directory: platform/WCS
        run: dotnet test src/Wcs.Host.Tests/Wcs.Host.Tests.csproj --configuration $env:CONFIGURATION --no-restore --verbosity normal

      - name: Build WCS Host
        working-directory: platform/WCS
        run: dotnet build src/Wcs.Host/Wcs.Host.csproj --configuration $env:CONFIGURATION --no-restore

      - name: Publish cloud validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'cloud-validation',
              description: passed ? 'WCS cloud validation passed' : 'WCS cloud validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
