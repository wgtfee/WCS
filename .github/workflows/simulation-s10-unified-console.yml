name: WCS S10 Unified Verification Console

on:
  pull_request:
    branches:
      - develop
      - feature/simulation-s9-real-hil-trial
    paths:
      - 'src/Wcs.Host/Controllers/SimulationVerificationOverviewController.cs'
      - 'src/Wcs.Desktop/Services/SimulationVerificationApiService.cs'
      - 'src/Wcs.Desktop/Services/SimulationInspectionApiService.cs'
      - 'src/Wcs.Desktop/ViewModels/SimulationVerificationViewModel.cs'
      - 'src/Wcs.Desktop/ViewModels/SimulationVerificationInspectionViewModel.cs'
      - 'src/Wcs.Desktop/Views/SimulationVerificationView.axaml'
      - 'src/Wcs.Desktop/Views/SimulationVerificationView.axaml.cs'
      - 'src/Wcs.Desktop/Views/SimulationStageInspectionView.axaml'
      - 'src/Wcs.Desktop/Views/SimulationStageInspectionView.axaml.cs'
      - 'src/Wcs.Desktop/Services/ServiceCollectionExtensions.cs'
      - 'src/Wcs.Desktop/ViewModels/MainWindowViewModel.cs'
      - 'src/Wcs.Simulator.Tests/SimulationUnifiedConsoleTests.cs'
      - '.github/workflows/simulation-s10-unified-console.yml'
      - 'docs/交付文件/86-*'
      - 'docs/交付文件/87-*'
      - 'docs/交付文件/88-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-console:
    name: verify S10 governed simulation console and safety boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore

      - name: Build Avalonia desktop
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Desktop/Wcs.Desktop.csproj
          dotnet build src/Wcs.Desktop/Wcs.Desktop.csproj -c Release --no-restore

      - name: Run exactly 10 S10 unified-console tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/s10-unified-console
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~SimulationUnifiedConsoleTests' \
            --logger 'trx;LogFileName=s10-unified-console.trx' \
            --results-directory artifacts/s10-unified-console
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path='artifacts/s10-unified-console/s10-unified-console.trx'
          root=ET.parse(path).getroot()
          results=root.findall('.//{*}UnitTestResult')
          failed=[x for x in results if x.attrib.get('outcome') != 'Passed']
          assert len(results) == 10, f'expected 10 S10 tests, got {len(results)}'
          assert not failed, f'failed S10 tests: {[x.attrib.get("testName") for x in failed]}'
          print('S10 unified console tests: 10/10 success')
          PY

      - name: Verify S10 overview HTTP surface remains read-only
        shell: bash
        run: |
          set -euo pipefail
          file='src/Wcs.Host/Controllers/SimulationVerificationOverviewController.cs'
          grep -q '\[HttpGet("overview")\]' "$file"
          ! grep -Eq '\[Http(Post|Put|Patch|Delete)' "$file"
          grep -q 'RemoteControlAllowed = false' "$file"
          grep -q 'RealHilExecuted = false' "$file"
          grep -q 'MechanicalSafetyAccepted = false' "$file"
          grep -q 'SiteAccepted = false' "$file"

      - name: Verify desktop uses only governed simulation execution APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('src/Wcs.Desktop/Services/SimulationVerificationApiService.cs').read_text(encoding='utf-8')
          view = Path('src/Wcs.Desktop/Views/SimulationVerificationView.axaml').read_text(encoding='utf-8')
          vm = Path('src/Wcs.Desktop/ViewModels/SimulationVerificationViewModel.cs').read_text(encoding='utf-8')
          di = Path('src/Wcs.Desktop/Services/ServiceCollectionExtensions.cs').read_text(encoding='utf-8')
          menu = Path('src/Wcs.Desktop/ViewModels/MainWindowViewModel.cs').read_text(encoding='utf-8')

          required = {
              'DI registration': 'ISimulationVerificationApiService' in di,
              'ViewModel registration': 'SimulationVerificationViewModel' in di,
              'Desktop route': '/SimulationVerification' in menu,
              'S10 title': 'S10 统一仿真与验证中心' in view,
              'governed API safety copy': '受治理 Scenario API' in (view + vm),
              'S0 validation API': '/api/simulation/governance/scenarios/validate' in service,
              'S1 run API': '/api/simulation/scenarios/runs' in service,
          }
          missing = [name for name, ok in required.items() if not ok]
          assert not missing, f'missing required governed-console markers: {missing}'

          assert not re.search(r'/api/simulation/virtual-(plc|rgv|traffic|external|health|integration)', service), \
              'execution client must not call direct S2-S7 virtual runtime endpoints'
          assert '/api/hil/verification' not in service, 'execution client must not call HIL endpoints'

          forbidden_control_types = (
              'CommandBus', 'TaskScheduler', 'TaskOrchestrator',
              'RouteReservation', 'IPlcConnection', 'S7Connection'
          )
          found = [name for name in forbidden_control_types if name in service]
          assert not found, f'execution client references production control types: {found}'

          print('S10 governed execution surface: PASS')
          PY

      - name: Verify S2-S8 layered inspection is GET-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('src/Wcs.Desktop/Services/SimulationInspectionApiService.cs').read_text(encoding='utf-8')
          vm = Path('src/Wcs.Desktop/ViewModels/SimulationVerificationInspectionViewModel.cs').read_text(encoding='utf-8')
          view = Path('src/Wcs.Desktop/Views/SimulationStageInspectionView.axaml').read_text(encoding='utf-8')
          di = Path('src/Wcs.Desktop/Services/ServiceCollectionExtensions.cs').read_text(encoding='utf-8')

          required_paths = (
              '/api/simulation/virtual-plc/',
              '/api/simulation/virtual-rgv/',
              '/api/simulation/virtual-traffic/',
              '/api/simulation/virtual-external/',
              '/api/simulation/virtual-health/',
              '/api/simulation/virtual-integration/',
              '/api/simulation/capacity-readiness/status',
          )
          assert 'ISimulationInspectionApiService' in di, 'inspection client is not registered in DI'
          assert 'GetAsync' in service, 'inspection client has no GET operation'
          missing = [path for path in required_paths if path not in service]
          assert not missing, f'missing S2-S8 inspection paths: {missing}'

          forbidden_methods = r'PostAsync|PostAsJsonAsync|PutAsync|PatchAsync|DeleteAsync|HttpMethod\.(Post|Put|Patch|Delete)'
          assert not re.search(forbidden_methods, service), 'inspection client contains a mutating HTTP method'
          assert '/api/hil/verification' not in service, 'inspection client must not call HIL endpoints'
          assert 'S2～S8 分层只读检查' in view, 'layered inspection UI marker missing'
          assert 'InspectStatusCommand' in view and 'InspectAuditCommand' in view, 'inspection commands missing'
          assert 'SelectedRun.IsTerminal' in vm, 'terminal-run checkpoint boundary missing'

          print('S2-S8 GET-only inspection surface: PASS')
          PY

      - name: Verify AtomUI operation surface
        shell: bash
        run: |
          set -euo pipefail
          views=(
            src/Wcs.Desktop/Views/SimulationVerificationView.axaml
            src/Wcs.Desktop/Views/SimulationStageInspectionView.axaml
          )
          for view in "${views[@]}"; do
            grep -q 'xmlns:atom="https://atomui.net"' "$view"
            grep -q '<atom:DataGrid' "$view"
            grep -q '<atom:Button' "$view"
            ! grep -nE '<Button([ >])|<TextBox([ >])|<DataGrid([ >])|<TabControl([ >])|<TabItem([ >])' "$view"
          done
          grep -q '<atom:TabControl' src/Wcs.Desktop/Views/SimulationVerificationView.axaml
          grep -q '<atom:LineEdit' src/Wcs.Desktop/Views/SimulationVerificationView.axaml

      - name: Write S10 contract evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/s10-unified-console/evidence.txt <<EOF
          head_sha=${GITHUB_SHA}
          stage=S10
          test_count=10
          desktop_build=true
          overview_api_read_only=true
          desktop_governed_simulation_execution=true
          layered_s2_s8_inspection_read_only=true
          direct_virtual_runtime_control=false
          remote_control_allowed=false
          real_hil_control=false
          real_hil_claimed=false
          mechanical_safety_claimed=false
          site_acceptance_claimed=false
          EOF

      - name: Upload S10 unified-console evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-s10-unified-verification-console-${{ github.run_number }}
          path: artifacts/s10-unified-console/**
          if-no-files-found: error
          retention-days: 30
