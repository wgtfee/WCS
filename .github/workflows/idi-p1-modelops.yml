name: WCS IDI P1 ModelOps Contract

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.ModelOps/**'
      - 'src/Wcs.Infrastructure/IndustrialIntelligence/ModelOps*'
      - 'src/Wcs.Infrastructure/Wcs.Infrastructure.csproj'
      - 'src/Wcs.Host/Controllers/ModelOpsController.cs'
      - 'src/Wcs.Desktop/Services/ModelOpsApiService.cs'
      - 'src/Wcs.Desktop/ViewModels/ModelOpsViewModel.cs'
      - 'src/Wcs.Desktop/Views/ModelOpsView.axaml*'
      - 'src/Wcs.Desktop/Services/ServiceCollectionExtensions.cs'
      - 'src/Wcs.Desktop/ViewModels/MainWindowViewModel.cs'
      - 'src/Wcs.Desktop/Wcs.Desktop.csproj'
      - 'src/Wcs.Simulator.Tests/ModelOpsCenter*.cs'
      - 'src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj'
      - 'src/Wcs.IndustrialIntelligence/**'
      - 'docs/交付文件/89-*'
      - 'docs/交付文件/90-*'
      - 'docs/交付文件/94-*'
      - 'docs/交付文件/95-*'
      - 'docs/交付文件/96-*'
      - 'docs/交付文件/00-*'
      - '.github/workflows/idi-p1-modelops.yml'
      - '.github/workflows/idi-p1-full-regression.yml'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modelops-contract:
    name: verify IDI-P1 ModelOps contracts, persistence and zero-control boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IDI_P1_SQL_CONNECTION: 'Server=127.0.0.1,1433;Database=WCS_IdiP1;User Id=sa;Password=Wcs_IdiP1!2026;Encrypt=False;TrustServerCertificate=True;'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Wcs_IdiP1!2026
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare SQL Server
        shell: bash
        run: |
          set -euo pipefail
          sql_container="$(docker ps --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-latest' --format '{{.ID}}' | head -n1)"
          test -n "$sql_container"
          for attempt in {1..90}; do
            if docker exec "$sql_container" bash -lc '
              sqlcmd=/opt/mssql-tools18/bin/sqlcmd
              if [[ ! -x "$sqlcmd" ]]; then sqlcmd=/opt/mssql-tools/bin/sqlcmd; fi
              "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
            ' >/dev/null 2>&1; then break; fi
            if [[ "$attempt" -eq 90 ]]; then docker logs "$sql_container"; exit 1; fi
            sleep 2
          done
          docker exec "$sql_container" bash -lc '
            sqlcmd=/opt/mssql-tools18/bin/sqlcmd
            if [[ ! -x "$sqlcmd" ]]; then sqlcmd=/opt/mssql-tools/bin/sqlcmd; fi
            "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d master -Q "IF DB_ID('"'"'WCS_IdiP1'"'"') IS NULL CREATE DATABASE [WCS_IdiP1]"
          '

      - name: Restore and build P1 contracts Host and Desktop
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore
          dotnet restore src/Wcs.Desktop/Wcs.Desktop.csproj
          dotnet build src/Wcs.Desktop/Wcs.Desktop.csproj -c Release --no-restore

      - name: Run exactly 32 P1 ModelOps tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/idi-p1-modelops
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~ModelOpsCenter' \
            --logger 'trx;LogFileName=idi-p1-modelops.trx' \
            --results-directory artifacts/idi-p1-modelops
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path='artifacts/idi-p1-modelops/idi-p1-modelops.trx'
          root=ET.parse(path).getroot()
          results=root.findall('.//{*}UnitTestResult')
          failed=[x for x in results if x.attrib.get('outcome') != 'Passed']
          assert len(results) == 32, f'expected 32 P1 tests, got {len(results)}'
          assert not failed, f'failed P1 tests: {[x.attrib.get("testName") for x in failed]}'
          print('IDI-P1 ModelOps tests: 32/32 success')
          PY

      - name: Verify ModelOps zero-control boundary
        shell: bash
        run: |
          set -euo pipefail
          scope='src/Wcs.ModelOps'
          banned='IPlcConnection|S7Client|Snap7|S7CommPlusDriver|IPlcClient|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|IRouteReservationManager|PlcWriter'
          if grep -RInE "$banned" "$scope"; then
            echo 'IDI-P1 ModelOps contains a forbidden control dependency.' >&2
            exit 1
          fi
          if grep -RInE 'HttpClient|SqlSugarClient|SqlConnection|Socket|TcpClient|UdpClient' "$scope"; then
            echo 'IDI-P1 domain project must remain isolated from network/SQL clients.' >&2
            exit 1
          fi
          if grep -E "$banned" src/Wcs.Host/Controllers/ModelOpsController.cs; then
            echo 'IDI-P1 Host ModelOps API references a control mutation type.' >&2
            exit 1
          fi
          grep -q 'controlWriteAllowed = false' src/Wcs.Host/Controllers/ModelOpsController.cs
          grep -q 'autoPromotionAllowed = false' src/Wcs.Host/Controllers/ModelOpsController.cs
          grep -q 'autoFallbackPromotion = false' src/Wcs.Host/Controllers/ModelOpsController.cs
          grep -q '不写 PLC' src/Wcs.Desktop/ViewModels/ModelOpsViewModel.cs

      - name: Verify SQL-backed persistence and singleton deployment constraints
        shell: bash
        run: |
          set -euo pipefail
          schema='src/Wcs.Infrastructure/IndustrialIntelligence/ModelOpsEntities.cs'
          store='src/Wcs.Infrastructure/IndustrialIntelligence/ModelOpsPersistence.cs'
          for table in \
            Wcs_AiModelRegistry \
            Wcs_AiModelPackage \
            Wcs_AiModelDeployment \
            Wcs_AiModelEvaluation \
            Wcs_AiModelDriftEvent \
            Wcs_AiModelAuditJournal; do
            grep -q "$table" "$schema"
          done
          grep -q 'ManifestJson' "$schema"
          grep -q 'UX_Wcs_AiModelRegistry_ModelVersion' "$schema"
          grep -q 'UX_Wcs_AiModelDeployment_VersionScope' "$schema"
          grep -q 'UX_Wcs_AiModelDeployment_ChampionScope' "$schema"
          grep -q 'UX_Wcs_AiModelDeployment_FallbackScope' "$schema"
          grep -q "WHERE DeploymentStatus = 'Champion'" "$schema"
          grep -q "WHERE DeploymentStatus = 'Fallback'" "$schema"
          grep -q 'class SqlModelRegistry' "$store"
          grep -q 'class SqlModelDeploymentStore' "$store"
          grep -q 'class SqlModelOpsAuditJournal' "$store"
          grep -q 'IsolationLevel.Serializable' "$store"

      - name: Verify governed Shadow and evaluation behavior
        shell: bash
        run: |
          set -euo pipefail
          governance='src/Wcs.ModelOps/ModelOpsGovernance.cs'
          grep -q 'class ModelDeploymentRecoveryService' "$governance"
          grep -q 'class GovernedShadowRuntime' "$governance"
          grep -q 'class ChampionChallengerEvaluator' "$governance"
          grep -q 'class ModelDriftMonitor' "$governance"
          grep -q 'AutoPromotionAllowed: false' "$governance"
          grep -q 'ControlWriteAllowed: false' "$governance"
          grep -q 'QuarantineChampionFailClosed' "$governance"

      - name: Verify Host and Desktop P1 surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q '\[Route("api/modelops")\]' src/Wcs.Host/Controllers/ModelOpsController.cs
          grep -q 'IModelOpsApiService' src/Wcs.Desktop/Services/ModelOpsApiService.cs
          grep -q 'class ModelOpsViewModel' src/Wcs.Desktop/ViewModels/ModelOpsViewModel.cs
          grep -q 'x:Class="Wcs.Desktop.Views.ModelOpsView"' src/Wcs.Desktop/Views/ModelOpsView.axaml
          grep -q 'Url = "/ModelOps"' src/Wcs.Desktop/ViewModels/MainWindowViewModel.cs
          grep -q 'AddHttpClient<IModelOpsApiService, ModelOpsApiService>()' src/Wcs.Desktop/Services/ServiceCollectionExtensions.cs

      - name: Verify P0 safety ceiling remains intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MaximumAutomationLevel > AutomationLevel.L1' src/Wcs.IndustrialIntelligence/Governance/IndustrialIntelligenceContracts.cs
          grep -q 'Production is fail-closed for IDI-P0' src/Wcs.IndustrialIntelligence/Governance/IndustrialIntelligenceContracts.cs

      - name: Write P1 evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/idi-p1-modelops/evidence.txt <<EOF
          stage=IDI-P1
          capability=ModelOpsCenter
          head_sha=${GITHUB_SHA}
          tests=32
          all_success=true
          sql_backed_registry=true
          restart_recovery=true
          single_champion=true
          single_fallback=true
          quarantine_fail_closed=true
          shadow_runtime=true
          champion_challenger_evaluation=true
          drift_evidence=true
          append_only_audit=true
          host_surface=true
          desktop_surface=true
          default_deployment=shadow
          auto_promotion_allowed=false
          control_write_allowed=false
          maximum_automation_level=L1
          production_automation_allowed=false
          package_sha256_required=true
          feature_schema_sha256_required=true
          immutable_model_version=true
          EOF

      - name: Upload P1 ModelOps evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-idi-p1-modelops-${{ github.run_number }}
          path: artifacts/idi-p1-modelops/**
          if-no-files-found: error
          retention-days: 30
