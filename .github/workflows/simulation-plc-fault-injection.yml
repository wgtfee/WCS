name: WCS Simulation PLC Fault Injection

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Simulator/VirtualPlc/**'
      - 'src/Wcs.Simulator.Tests/SimulationVirtualPlcTests.cs'
      - 'src/Wcs.Host/Controllers/SimulationVirtualPlcController.cs'
      - 'src/Wcs.Host/appsettings.Simulation*.json'
      - '.github/workflows/simulation-plc-fault-injection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fault-injection:
    name: verify disconnect, timeout, failure, stuck, bit-flip, jitter, and out-of-range faults
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        run: |
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj 2>&1 | tee simulation-s2-fault-restore.log
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj --configuration Release --no-restore 2>&1 | tee simulation-s2-fault-build.log

      - name: Run fault matrix and replay tests
        run: |
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            --configuration Release --no-build \
            --filter 'FullyQualifiedName~SimulationVirtualPlcTests' \
            --logger 'trx;LogFileName=simulation-s2-faults.trx' \
            2>&1 | tee simulation-s2-fault-test.log

      - name: Verify complete fault catalog and no real control path
        shell: bash
        run: |
          set -euo pipefail
          for fault in Disconnect Timeout ReadFailure WriteFailure Stuck BitFlip Jitter OutOfRange; do
            grep -R -n "$fault" src/Wcs.Simulator/VirtualPlc >/dev/null
          done
          ! grep -R -nE 'IPlcClient|IPlcConnection|PlcWriter|CommandBus|DispatchEngine|ResourceLockManager|RouteLock' src/Wcs.Simulator/VirtualPlc
          grep -R -n 'return NotFound()' src/Wcs.Host/Controllers/SimulationVirtualPlcController.cs

      - name: Upload fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-simulation-plc-fault-injection-${{ github.run_number }}
          path: |
            simulation-s2-fault-*.log
            src/Wcs.Simulator.Tests/TestResults/**
          if-no-files-found: warn
          retention-days: 14
