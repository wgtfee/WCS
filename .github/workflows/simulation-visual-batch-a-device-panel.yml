name: WCS Visual Simulation Batch A Device Panel

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/Wcs.Desktop/ViewModels/SimulationVerificationDeviceOperationsViewModel.cs'
      - 'src/Wcs.Desktop/ViewModels/SimulationVerificationDeviceOperationsSelectionViewModel.cs'
      - 'src/Wcs.Desktop/Views/SimulationDeviceOperationsView.axaml'
      - 'src/Wcs.Desktop/Views/SimulationDeviceOperationsView.axaml.cs'
      - 'src/Wcs.Desktop/Views/SimulationStageInspectionView.axaml.cs'
      - '.github/workflows/simulation-visual-batch-a-device-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-a:
    name: build and verify PLC RGV governed device panel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build Desktop
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Desktop/Wcs.Desktop.csproj
          dotnet build src/Wcs.Desktop/Wcs.Desktop.csproj -c Release --no-restore

      - name: Restore Simulator tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore

      - name: Run S2 and S3 simulator regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~SimulationVirtualPlcTests|FullyQualifiedName~SimulationVirtualRgvTests'

      - name: Verify governed device operation surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          vm = Path('src/Wcs.Desktop/ViewModels/SimulationVerificationDeviceOperationsViewModel.cs').read_text(encoding='utf-8')
          select_vm = Path('src/Wcs.Desktop/ViewModels/SimulationVerificationDeviceOperationsSelectionViewModel.cs').read_text(encoding='utf-8')
          view = Path('src/Wcs.Desktop/Views/SimulationDeviceOperationsView.axaml').read_text(encoding='utf-8')
          host_view = Path('src/Wcs.Desktop/Views/SimulationStageInspectionView.axaml.cs').read_text(encoding='utf-8')

          plc_actions = (
              'plc.block.define', 'plc.block.write', 'plc.block.read',
              'plc.fault.apply', 'plc.fault.clear'
          )
          rgv_actions = (
              'rgv.segment.define', 'rgv.vehicle.define', 'rgv.route.assign',
              'rgv.vehicle.advance', 'rgv.vehicle.online.set',
              'rgv.vehicle.load', 'rgv.vehicle.unload'
          )
          faults = ('Disconnect', 'Timeout', 'ReadFailure', 'WriteFailure', 'Stuck', 'BitFlip', 'Jitter', 'OutOfRange')
          missing = [x for x in plc_actions + rgv_actions + faults if x not in vm + select_vm + view]
          assert not missing, f'missing batch-A capability markers: {missing}'

          commands = (
              'GenerateDevicePlcScenarioCommand', 'GenerateAndRegisterDevicePlcScenarioCommand',
              'GenerateDeviceRgvScenarioCommand', 'GenerateAndRegisterDeviceRgvScenarioCommand',
              'SelectDevicePlcFaultKindCommand'
          )
          missing_commands = [x for x in commands if x not in view]
          assert not missing_commands, f'missing batch-A UI commands: {missing_commands}'

          assert 'PLC / RGV 设备操作' in host_view, 'device operation tab is not exposed'
          assert 'SimulationDeviceOperationsView' in host_view, 'device operation view is not wired'
          assert 'xmlns:atom="https://atomui.net"' in view
          for marker in ('<atom:Card', '<atom:LineEdit', '<atom:Button'):
              assert marker in view, f'AtomUI marker missing: {marker}'
          assert not re.search(r'<Button([ >])|<TextBox([ >])|<DataGrid([ >])|<TabControl([ >])|<TabItem([ >])', view), \
              'batch-A view regressed to native product controls'

          source = vm + select_vm + view + host_view
          forbidden = (
              'CommandBus', 'TaskScheduler', 'TaskOrchestrator', 'DeviceManager',
              'TrafficCoordinator', 'RouteReservationManager', 'IPlcConnection',
              'S7Connection', 'PlcForceWrite', '/api/hil/verification',
              'HttpClient', 'PostAsync', 'PutAsync', 'PatchAsync', 'DeleteAsync'
          )
          found = [x for x in forbidden if x in source]
          assert not found, f'batch-A references forbidden production/HIL control surface: {found}'
          assert 'RegisterScenarioAsync' in vm, 'batch-A must reuse existing S0 registration path'
          print('Batch A governed PLC/RGV device panel: PASS')
          PY

      - name: Write evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/simulation-visual-batch-a
          cat > artifacts/simulation-visual-batch-a/evidence.txt <<EOF
          head_sha=${GITHUB_SHA}
          batch=A
          desktop_build=true
          simulator_s2_s3_tests=true
          plc_fault_kinds=8
          governed_s0_registration=true
          direct_production_control=false
          direct_hil_control=false
          atomui_surface=true
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-simulation-visual-batch-a-${{ github.run_number }}
          path: artifacts/simulation-visual-batch-a/**
          if-no-files-found: error
          retention-days: 30
