name: WCS S9 HIL Governance Contract

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Simulator/HilVerification/**'
      - 'src/Wcs.Simulator.Tests/SimulationHilVerificationTests.cs'
      - 'docs/交付文件/82-*'
      - '.github/workflows/simulation-s9-hil-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hil-contract:
    name: verify S9 real-HIL governance without faking hardware acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore

      - name: Run exactly 12 S9 HIL governance tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/s9-hil-contract
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~SimulationHilVerificationTests' \
            --logger 'trx;LogFileName=s9-hil-contract.trx' \
            --results-directory artifacts/s9-hil-contract
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path='artifacts/s9-hil-contract/s9-hil-contract.trx'
          root=ET.parse(path).getroot()
          results=root.findall('.//{*}UnitTestResult')
          failed=[x for x in results if x.attrib.get('outcome') != 'Passed']
          assert len(results) == 12, f'expected 12 S9 tests, got {len(results)}'
          assert not failed, f'failed S9 tests: {[x.attrib.get("testName") for x in failed]}'
          print('S9 HIL governance tests: 12/12 success')
          PY

      - name: Verify framework cannot perform real hardware IO
        shell: bash
        run: |
          set -euo pipefail
          scope='src/Wcs.Simulator/HilVerification'
          banned='HttpClient|Socket|TcpClient|UdpClient|SqlSugar|SqlConnection|Microsoft.Data.SqlClient|System.Data.SqlClient|S7Client|Snap7|S7CommPlusDriver|IPlcClient|IPlcConnection|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|IRouteReservationManager|InferenceSession'
          if grep -RInE "$banned" "$scope"; then
            echo 'S9 governance layer contains a forbidden production/real-IO dependency.' >&2
            exit 1
          fi
          grep -RIn 'SelfHostedHil' "$scope"
          grep -RIn 'RealHardwareConnected' "$scope"
          grep -RIn 'MechanicalSafetyAccepted' "$scope"
          grep -RIn 'SiteAccepted' "$scope"
          grep -RIn 'ProtocolValidated' "$scope"

      - name: Verify fail-closed HIL semantics
        shell: bash
        run: |
          set -euo pipefail
          file='src/Wcs.Simulator/HilVerification/HilVerificationRuntime.cs'
          grep -q 'HilVerification is disabled' "$file"
          grep -q 'isolated from the production network' "$file"
          grep -q 'must not use production credentials' "$file"
          grep -q 'requires a SelfHostedHil runner attestation' "$file"
          grep -q 'site acceptance still required' "$file"

      - name: Upload S9 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-s9-hil-governance-contract-${{ github.run_number }}
          path: artifacts/s9-hil-contract/**
          if-no-files-found: error
          retention-days: 30
