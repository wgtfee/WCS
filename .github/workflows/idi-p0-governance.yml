name: WCS IDI P0 Governance Contract

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.IndustrialIntelligence/**'
      - 'src/Wcs.Infrastructure/IndustrialIntelligence/**'
      - 'src/Wcs.Host/Controllers/IndustrialIntelligenceController.cs'
      - 'src/Wcs.Host/appsettings.IndustrialIntelligence.json'
      - 'src/Wcs.Host/appsettings.Production.json'
      - 'src/Wcs.Host/Wcs.Host.csproj'
      - 'src/Wcs.Simulator.Tests/IndustrialIntelligenceGovernanceTests.cs'
      - 'src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj'
      - 'docs/交付文件/89-*'
      - 'docs/交付文件/90-*'
      - 'docs/交付文件/91-*'
      - 'docs/交付文件/92-*'
      - 'docs/交付文件/93-*'
      - '.github/workflows/idi-p0-governance.yml'
      - '.github/workflows/idi-p0-full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contract:
    name: verify IDI-P0 governance and zero-control boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build P0 contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore

      - name: Run exactly 14 P0 governance tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/idi-p0-governance
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~IndustrialIntelligenceGovernanceTests' \
            --logger 'trx;LogFileName=idi-p0-governance.trx' \
            --results-directory artifacts/idi-p0-governance
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path='artifacts/idi-p0-governance/idi-p0-governance.trx'
          root=ET.parse(path).getroot()
          results=root.findall('.//{*}UnitTestResult')
          failed=[x for x in results if x.attrib.get('outcome') != 'Passed']
          assert len(results) == 14, f'expected 14 P0 tests, got {len(results)}'
          assert not failed, f'failed P0 tests: {[x.attrib.get("testName") for x in failed]}'
          print('IDI-P0 governance tests: 14/14 success')
          PY

      - name: Verify zero production-control dependencies
        shell: bash
        run: |
          set -euo pipefail
          scope='src/Wcs.IndustrialIntelligence'
          banned='IPlcConnection|S7Client|Snap7|S7CommPlusDriver|IPlcClient|IPlcConnection|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|IRouteReservationManager|PlcWriter'
          if grep -RInE "$banned" "$scope"; then
            echo 'IDI-P0 core contains a forbidden control dependency.' >&2
            exit 1
          fi
          controller='src/Wcs.Host/Controllers/IndustrialIntelligenceController.cs'
          if grep -nE '\[Http(Post|Put|Patch|Delete)' "$controller"; then
            echo 'IDI-P0 Host surface contains a mutating HTTP action.' >&2
            exit 1
          fi
          test "$(grep -c '\[HttpGet' "$controller")" -eq 2
          grep -q 'ControlWriteAllowed = false' "$controller"
          grep -q 'Production is fail-closed for IDI-P0' src/Wcs.IndustrialIntelligence/Governance/IndustrialIntelligenceContracts.cs

      - name: Verify isolated environment and persistence contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"Simulator"' src/Wcs.Host/appsettings.IndustrialIntelligence.json
          grep -q '"Enabled": true' src/Wcs.Host/appsettings.IndustrialIntelligence.json
          grep -q '"MaximumAutomationLevel": "L1"' src/Wcs.Host/appsettings.IndustrialIntelligence.json
          grep -q 'Wcs_IndustrialIntelligenceAuditJournal' src/Wcs.Infrastructure/IndustrialIntelligence/IndustrialIntelligenceGovernanceEntities.cs
          grep -q 'Wcs_IndustrialIntelligenceEvidence' src/Wcs.Infrastructure/IndustrialIntelligence/IndustrialIntelligenceGovernanceEntities.cs
          if grep -RInE 'Updateable<IndustrialIntelligence|Deleteable<IndustrialIntelligence' src/Wcs.Infrastructure/IndustrialIntelligence; then
            echo 'P0 append-only governance persistence exposes update/delete.' >&2
            exit 1
          fi

      - name: Write P0 evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/idi-p0-governance/evidence.txt <<EOF
          stage=IDI-P0
          head_sha=${GITHUB_SHA}
          tests=14
          all_success=true
          read_only=true
          control_write_allowed=false
          production_allowed=false
          maximum_automation_level=L1
          audit_append_only=true
          evidence_sha256_required=true
          EOF

      - name: Upload P0 governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-idi-p0-governance-${{ github.run_number }}
          path: artifacts/idi-p0-governance/**
          if-no-files-found: error
          retention-days: 30
