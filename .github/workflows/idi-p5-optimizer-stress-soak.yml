name: WCS IDI P5 Optimizer Stress Soak

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Optimization/**'
      - 'src/Wcs.Simulator/Optimization/**'
      - 'src/Wcs.Infrastructure/IndustrialIntelligence/Optimization*'
      - 'src/Wcs.Host/Controllers/DigitalTwinOptimizerController.cs'
      - 'src/Wcs.Desktop/**DigitalTwinOptimizer*'
      - 'src/Wcs.Simulator.Tests/DigitalTwinOptimizer*.cs'
      - '.github/workflows/idi-p5-optimizer-stress-soak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer-stress-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build simulator tests Release
        run: dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release

      - name: Repeat six-candidate integration matrix three times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/idi-p5-stress-soak
          : > artifacts/idi-p5-stress-soak/integration-runs.txt
          for round in 1 2 3; do
            OUT=$(dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~DigitalTwinOptimizerIntegrationTests' --logger 'console;verbosity=normal')
            printf '=== repetition %s ===\n%s\n' "$round" "$OUT" | tee -a artifacts/idi-p5-stress-soak/integration-runs.txt
            echo "$OUT" | grep -Eq 'Total tests:[[:space:]]+6'
            echo "$OUT" | grep -Eq 'Passed:[[:space:]]+6'
            ! echo "$OUT" | grep -Eq 'Failed:[[:space:]]+[1-9][0-9]*'
          done

      - name: Run unchanged S8 capacity and virtual-soak gate
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~SimulationCapacityReadinessTests' --logger 'console;verbosity=normal')
          printf '%s\n' "$OUT" | tee artifacts/idi-p5-stress-soak/capacity-readiness.txt
          echo "$OUT" | grep -Eq 'Total tests:[[:space:]]+12'
          echo "$OUT" | grep -Eq 'Passed:[[:space:]]+12'
          ! echo "$OUT" | grep -Eq 'Failed:[[:space:]]+[1-9][0-9]*'

      - name: Verify stress-soak safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n 'ProductionAutomationAllowed => false' src/Wcs.Optimization
          grep -R -n 'AutoProductionPolicyReplacementAllowed => false' src/Wcs.Optimization
          ! grep -R -n -E 'S7Client|S7RealClient|S7CommPlusDriver|Snap7|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|RouteReservationManager|IRouteReservationManager|WriteAsync\(|HttpClient|SqlSugar' src/Wcs.Optimization src/Wcs.Simulator/Optimization

      - name: Write stress-soak evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '{"schema":"wcs-idi-p5-stress-soak/v1","head_sha":"%s","integrationRepetitions":3,"integrationTestsPerRepetition":6,"integrationPassedTotal":18,"s8CapacityReadinessTests":12,"includesEightHourVirtualSoak":true,"includesTwentyFourHourVirtualSoak":true,"realHilExecuted":false,"controlWriteAllowed":false,"autoProductionPolicyReplacementAllowed":false,"productionAutomationAllowed":false,"oneHourSoakIsSeparateCumulativeGate":true}\n' "$GITHUB_SHA" > artifacts/idi-p5-stress-soak/evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wcs-idi-p5-optimizer-stress-soak-${{ github.run_number }}
          path: artifacts/idi-p5-stress-soak/**
          if-no-files-found: error
          retention-days: 30
