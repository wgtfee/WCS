name: WCS S9 Real HIL Evidence Gate

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character S9 software commit SHA executed on the HIL bench
        required: true
        type: string
      session_id:
        description: Approved HIL session id
        required: true
        type: string
      bench_id:
        description: Approved isolated HIL bench id
        required: true
        type: string

permissions:
  contents: read

jobs:
  real-hil-evidence:
    name: validate site-owned real-HIL evidence on dedicated self-hosted runner
    runs-on: [self-hosted, wcs-hil]
    environment: wcs-hil
    timeout-minutes: 60
    env:
      HIL_EVIDENCE_MANIFEST: ${{ vars.WCS_HIL_EVIDENCE_MANIFEST }}
      HIL_EVIDENCE_BUNDLE: ${{ vars.WCS_HIL_EVIDENCE_BUNDLE }}
    steps:
      - name: Fail closed unless exact head and local evidence paths are supplied
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.expected_head }}' =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$HIL_EVIDENCE_MANIFEST"
          test -n "$HIL_EVIDENCE_BUNDLE"
          test -f "$HIL_EVIDENCE_MANIFEST"
          test -f "$HIL_EVIDENCE_BUNDLE"
          test "$(stat -c%s "$HIL_EVIDENCE_MANIFEST")" -le 1048576
          test "$(stat -c%s "$HIL_EVIDENCE_BUNDLE")" -le 2147483648

      - name: Checkout the exact software head that was executed
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 1

      - name: Verify checkout and dedicated runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.expected_head }}'
          echo 'Runner name: ${{ runner.name }}'
          echo 'Runner OS: ${{ runner.os }}'
          echo 'This job is intentionally unavailable on GitHub-hosted runners.'

      - name: Validate externally produced real-HIL manifest and evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/s9-real-hil
          python3 scripts/s9/validate_hil_evidence.py \
            --manifest "$HIL_EVIDENCE_MANIFEST" \
            --bundle "$HIL_EVIDENCE_BUNDLE" \
            --expected-head '${{ inputs.expected_head }}' \
            --expected-bench '${{ inputs.bench_id }}' \
            --expected-session '${{ inputs.session_id }}' \
            --output artifacts/s9-real-hil/validated-summary.json
          cp "$HIL_EVIDENCE_MANIFEST" artifacts/s9-real-hil/site-manifest.json
          cp "$HIL_EVIDENCE_BUNDLE" artifacts/s9-real-hil/site-evidence-bundle.bin
          sha256sum artifacts/s9-real-hil/site-manifest.json artifacts/s9-real-hil/site-evidence-bundle.bin \
            | tee artifacts/s9-real-hil/artifact-sha256.txt

      - name: Upload immutable S9 real-HIL evidence
        uses: actions/upload-artifact@v4
        with:
          name: wcs-s9-real-hil-evidence-${{ inputs.session_id }}-${{ github.run_number }}
          path: artifacts/s9-real-hil/**
          if-no-files-found: error
          retention-days: 90
