name: WCS Simulation Governance Compile

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Simulator/**'
      - 'src/Wcs.Simulator.Tests/**'
      - 'src/Wcs.Host/Controllers/SimulationGovernanceController.cs'
      - 'src/Wcs.Host/BackgroundServices/SimulatorBackgroundService.cs'
      - 'src/Wcs.Host/appsettings.Simulation*.json'
      - '.github/workflows/simulation-governance*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: compile governance contracts, API, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Remove previous outputs
        shell: bash
        run: |
          rm -rf src/Wcs.Simulator/bin src/Wcs.Simulator/obj
          rm -rf src/Wcs.Simulator.Tests/bin src/Wcs.Simulator.Tests/obj
          rm -rf src/Wcs.Host/bin src/Wcs.Host/obj

      - name: Restore
        run: dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj 2>&1 | tee simulation-governance-restore.log

      - name: Build tests and Host dependency graph
        run: dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj --configuration Release --no-restore 2>&1 | tee simulation-governance-build.log

      - name: Run governance contracts
        run: |
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            --configuration Release --no-build \
            --logger 'trx;LogFileName=simulation-governance-tests.trx' \
            --results-directory TestResults \
            2>&1 | tee simulation-governance-tests.log

      - name: Build Host directly
        run: dotnet build src/Wcs.Host/Wcs.Host.csproj --configuration Release --no-restore 2>&1 | tee simulation-governance-host-build.log

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-simulation-governance-compile-${{ github.run_number }}
          path: |
            simulation-governance-*.log
            TestResults/**
          if-no-files-found: error
          retention-days: 14
