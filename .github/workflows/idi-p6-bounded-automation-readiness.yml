name: WCS IDI P6 Bounded Automation Readiness Contract

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.IndustrialIntelligence/Governance/BoundedAutomationReadiness.cs'
      - 'src/Wcs.Simulator.Tests/BoundedAutomationReadinessTests.cs'
      - '.github/workflows/idi-p6-bounded-automation-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-automation-readiness:
    name: verify P6 software-side readiness and permanent prohibitions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build P6 contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore

      - name: Run exactly 42 P6 specialty tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/idi-p6-readiness
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~BoundedAutomationReadinessTests' \
            --logger 'trx;LogFileName=idi-p6-readiness.trx' \
            --results-directory artifacts/idi-p6-readiness
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path='artifacts/idi-p6-readiness/idi-p6-readiness.trx'
          root=ET.parse(path).getroot()
          results=root.findall('.//{*}UnitTestResult')
          failed=[x for x in results if x.attrib.get('outcome') != 'Passed']
          assert len(results) == 42, f'expected exactly 42 P6 tests, got {len(results)}'
          assert not failed, f'failed P6 tests: {[x.attrib.get("testName") for x in failed]}'
          print('IDI-P6 bounded automation readiness tests: 42/42 success')
          PY

      - name: Verify permanent fail-closed and zero-control boundary
        shell: bash
        run: |
          set -euo pipefail
          scope='src/Wcs.IndustrialIntelligence/Governance/BoundedAutomationReadiness.cs'
          banned='S7Client|S7RealClient|Snap7|S7CommPlusDriver|IPlcClient|IPlcConnection|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|RouteReservationManager|IRouteReservationManager|PlcWriter|WriteAsync\('
          if grep -nE "$banned" "$scope"; then
            echo 'IDI-P6 governance contains a forbidden production-control dependency.' >&2
            exit 1
          fi
          grep -q 'ProductionEnablementAllowed = false' "$scope"
          grep -q 'software-side ready only' "$scope"
          grep -q 'EmergencyStop' "$scope"
          grep -q 'SafetyReset' "$scope"
          grep -q 'SafetyDoorBypass' "$scope"
          grep -q 'LightCurtainBypass' "$scope"
          grep -q 'MechanicalInterlockBypass' "$scope"
          grep -q 'PlcForceWrite' "$scope"
          grep -q 'AutomaticRoadRightRelease' "$scope"
          grep -q 'AutomaticBlockRelease' "$scope"
          grep -q 'UnapprovedShutdown' "$scope"
          grep -q 'StateMachineBypass' "$scope"
          grep -q 'TrafficConstraintBypass' "$scope"
          grep -q 'Production is fail-closed for IDI-P0' src/Wcs.IndustrialIntelligence/Governance/IndustrialIntelligenceContracts.cs

      - name: Write exact-head P6 software evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/idi-p6-readiness
          cat > artifacts/idi-p6-readiness/evidence.json <<EOF
          {"schema":"wcs-idi-p6-readiness/v1","head_sha":"${EVIDENCE_HEAD_SHA}","testCount":42,"allSuccess":true,"finalClaim":"software-side ready only","productionEnablementAllowed":false,"defaultsDisabled":true,"permanentProhibitionCount":11,"realSiteEvidenceRequiredForL2L3":true,"realHilEvidenceRequiredForL2L3":true,"controlWriteAllowed":false}
          EOF
          test "$(jq -r '.head_sha' artifacts/idi-p6-readiness/evidence.json)" = "$EVIDENCE_HEAD_SHA"
          test "$(jq -r '.testCount' artifacts/idi-p6-readiness/evidence.json)" -eq 42
          test "$(jq -r '.productionEnablementAllowed' artifacts/idi-p6-readiness/evidence.json)" = 'false'

      - name: Upload P6 readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-idi-p6-bounded-automation-readiness-${{ github.run_number }}
          path: artifacts/idi-p6-readiness/**
          if-no-files-found: error
          retention-days: 30
