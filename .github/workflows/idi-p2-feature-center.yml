name: WCS IDI P2 Feature Center Contract

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.FeatureCenter/**'
      - 'src/Wcs.Infrastructure/IndustrialIntelligence/FeatureCenter*.cs'
      - 'src/Wcs.Host/**'
      - 'src/Wcs.Desktop/**'
      - 'src/Wcs.Simulator.Tests/FeatureCenterContractTests.cs'
      - 'src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj'
      - '.github/workflows/idi-p2-feature-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-center-contract:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/idi-p2-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build Feature Center
        run: |
          set -euo pipefail
          dotnet restore src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj
          dotnet build src/Wcs.FeatureCenter/Wcs.FeatureCenter.csproj -c Release --no-restore
          dotnet build src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-restore
      - name: Run exactly 21 P2 contract tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/idi-p2-feature-center
          dotnet test src/Wcs.Simulator.Tests/Wcs.Simulator.Tests.csproj -c Release --no-build \
            --filter 'FullyQualifiedName~FeatureCenterContractTests' \
            --logger 'trx;LogFileName=feature-center.trx' | tee artifacts/idi-p2-feature-center/test-output.txt
          grep -Eq 'Passed![[:space:]]+- Failed:[[:space:]]+0,[[:space:]]+Passed:[[:space:]]+21,[[:space:]]+Skipped:[[:space:]]+0,[[:space:]]+Total:[[:space:]]+21' artifacts/idi-p2-feature-center/test-output.txt
      - name: Verify zero-control and bounded Feature Center boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'IPlcConnection|S7Client|Snap7|CommandBus|TaskScheduler|TaskOrchestrator|DeviceManager|UnifiedTransportDispatchEngine|TransportTrafficCoordinator|IRouteReservationManager|HttpClient|SqlSugar|SqlConnection' src/Wcs.FeatureCenter; then
            echo 'Feature Center contains forbidden control/network/SQL dependency.' >&2
            exit 1
          fi
          grep -RIn 'MaximumDatasetRows' src/Wcs.FeatureCenter >/dev/null
          grep -RIn 'ControlWriteAllowed' src/Wcs.ModelOps >/dev/null
      - name: Write software evidence
        run: |
          set -euo pipefail
          printf 'stage=IDI-P2\nhead_sha=%s\ntest_count=21\ncontrol_write_allowed=false\nmaximum_automation_level=L1\nproduction_automation_allowed=false\n' "$GITHUB_SHA" | tee artifacts/idi-p2-feature-center/evidence.txt
      - name: Upload P2 contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: wcs-idi-p2-feature-center-${{ github.run_number }}
          path: artifacts/idi-p2-feature-center/**
          if-no-files-found: error
          retention-days: 30
