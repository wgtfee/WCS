name: WCS Asset Health Maintenance Compile

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/Wcs.Core/AnomalyDetection/Maintenance/**'
      - 'src/Wcs.Core.Tests/AssetHealthMaintenance*'
      - 'src/Wcs.Infrastructure/AnomalyDetection/Maintenance/**'
      - 'src/Wcs.Infrastructure/AnomalyDetection/Fusion/AnomalyFusionDependencyInjection.cs'
      - 'src/Wcs.Infrastructure/Persistence/DatabaseInitializer.cs'
      - 'src/Wcs.Host/Controllers/AnomalyMaintenance*'
      - 'src/Wcs.Host/appsettings*.json'
      - '.github/workflows/anomaly-maintenance*.yml'

jobs:
  compile:
    name: compile maintenance core and host with retained logs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore src/Wcs.Core.Tests/Wcs.Core.Tests.csproj 2>&1 | tee maintenance-restore.log
          dotnet restore src/Wcs.Host/Wcs.Host.csproj 2>&1 | tee -a maintenance-restore.log
      - name: Build Core tests
        run: dotnet build src/Wcs.Core.Tests/Wcs.Core.Tests.csproj --configuration Release --no-restore 2>&1 | tee maintenance-core-build.log
      - name: Run maintenance tests
        run: dotnet test src/Wcs.Core.Tests/Wcs.Core.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AssetHealthMaintenance" --logger "trx;LogFileName=maintenance-tests.trx" --results-directory TestResults 2>&1 | tee maintenance-tests.log
      - name: Build Host
        run: dotnet build src/Wcs.Host/Wcs.Host.csproj --configuration Release --no-restore 2>&1 | tee maintenance-host-build.log
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcs-asset-health-maintenance-compile-${{ github.run_number }}
          path: |
            maintenance-*.log
            TestResults/**
          if-no-files-found: warn
          retention-days: 14
